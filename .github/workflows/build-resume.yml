name: Build Resume and Preview

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

concurrency:
  group: build-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Umar_Akram_iOS_Dev.tex

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Generate Preview Image
        run: pdftoppm -png -r 150 -f 1 -l 1 -singlefile Umar_Akram_iOS_Dev.pdf resume-preview

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile Resume and Preview [skip ci]"
          file_pattern: "Umar_Akram_iOS_Dev.pdf resume-preview.png"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: Umar_Akram_iOS_Dev.pdf
          retention-days: 30
